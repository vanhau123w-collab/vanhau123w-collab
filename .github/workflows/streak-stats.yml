name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Runs every day at 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Updates when the workflow file is changed
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the generated SVG
    steps:
      - uses: actions/checkout@v3
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&background=0d1117
          path: profile/streak.svg
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg || echo "No file to add"
          git commit -m "docs: update streak stats SVG" || exit 0
          git push
