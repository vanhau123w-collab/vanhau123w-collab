name: Auto-Update Latest Projects

on:
  schedule:
    - cron: '0 0 * * *' # Lên lịch chạy tự động vào nửa đêm (UTC) mỗi ngày
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" thủ công để test

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Lấy dữ liệu và Cập nhật README
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // Gọi GitHub API lấy 5 repository mới cập nhật gần nhất của bạn
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'vanhau123w-collab',
              sort: 'updated',
              per_page: 5
            });

            const customDescriptions = {
              'My_Portfolio': 'Trang web Portfolio cá nhân với giao diện hiện đại được xây dựng bằng Next.js, Tailwind CSS và TypeScript.',
              'XeNow': 'Ứng dụng quản lý dịch vụ đặt xe và theo dõi hành trình được xây dựng bằng Java.',
              'DacSanViet': 'Website giới thiệu và đặt hàng món ăn đặc sản vùng miền Việt Nam.',
              'AdapterDemo': 'Chương trình mô phỏng và triển khai cấu trúc Adapter Design Pattern bằng Python.',
              'Autoquiz': 'Công cụ tự động hóa làm bài kiểm tra trắc nghiệm trực tuyến viết bằng Java.',
              'Autoquizz': 'Công cụ tự động hóa làm bài kiểm tra trắc nghiệm trực tuyến viết bằng Java.',
              'javascript': 'Dự án tổng hợp các bài tập và thực hành về ngôn ngữ lập trình JavaScript.',
              'meCungCuoiKyTest': 'Mô phỏng thuật toán AI tìm đường trong mê cung bằng Python và thư viện Pygame.'
            };

            const customLanguages = {
              'My_Portfolio': 'Next.js / TypeScript',
              'DacSanViet': 'ReactJS',
              'meCungCuoiKyTest': 'Python / Pygame'
            };

            let projectList = '\n';
            let count = 0;
            
            repos.forEach(repo => {
              // Bỏ qua repo chứa profile và các repo fork (nếu muốn)
              if(repo.name !== 'vanhau123w-collab' && !repo.fork && count < 3) {
                 const desc = customDescriptions[repo.name] || repo.description || 'Đang cập nhật mô tả...';
                 const lang = customLanguages[repo.name] || repo.language || 'N/A';
                 projectList += `### 🔹 [${repo.name}](${repo.html_url})\n`;
                 projectList += `> ${desc}\n`;
                 projectList += `- **Công nghệ chính:** ${lang}\n\n`;
                 count++;
               }
             });

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');

            // Tìm vị trí giữa 2 mốc và thay thế bằng danh sách project mới
            const regex = /(<!-- START_SECTION:projects -->)[\s\S]*?(<!-- END_SECTION:projects -->)/;
            readme = readme.replace(regex, `$1${projectList}$2`);

            fs.writeFileSync(readmePath, readme);

      - name: Commit và Push thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: tự động cập nhật dự án mới nhất" || echo "Không có thay đổi mới để commit"
          git push
